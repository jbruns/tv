# Arctic Fuse's Shortcut Nodes: the widget rows under the home and hub
# screens, and the power menu. Each file is rendered whole — every byte is the
# Reconciler's — and each is declared by name.
#
# The directory is never enumerated. The Device holds eight node files there
# and these six are ours; `skinvariables-shortcut-homesubmenu.json` and
# `-searchwidgets.json` are the skin's own, carrying generated `guid-…` ids,
# and owning the directory would delete two working files on the first Run.
#
# A shortcut states exactly one of `playlist` and `path`. `playlist` names a
# Smart Playlist declared in playlists.yaml and supplies both the path and the label, so a
# shortcut pointing at a playlist nobody declares is unrepresentable rather
# than merely detectable — which is what nothing stopped when
# RecentlyReleasedMovies90Days.xsp was superseded and retired. `path` carries a
# builtin, or a playlist some other add-on supplies, and then states its own
# label.
#
# Every `guid` is declared. The add-on invents `guid-{random}` for an item
# that carries none, which would differ on every Run and plan a Change
# forever. The existing ids do not derive cleanly from anything, so they are
# stated explicitly.
#
# Applying any of these restarts Kodi: the skin reads a node file when it
# loads, and its own shortcut editor holds the list it read.
#
# Restarting is not enough to show a changed node. `script.skinvariables`
# compiles every node into the generator include when Home loads, and skips
# that compile while the Skin String `script-skinvariables-generator-hash`
# matches a hash the node files are not part of. So a Run that changes a node
# clears that hash while Kodi is stopped. The compile then runs and stores a
# fresh hash, and the Run waits until the include has changed (ADR 0023).
rebuild:
  trigger:
    document: /storage/.kodi/userdata/addon_data/skin.arctic.fuse.3/settings.xml
    setting: script-skinvariables-generator-hash
  compiles_to: /storage/.kodi/addons/skin.arctic.fuse.3/1080i/script-skinvariables-generator-includes-.xml
shortcut_nodes:
  # The widget row on the home screen.
  - document: /storage/.kodi/userdata/addon_data/script.skinvariables/nodes/skin.arctic.fuse.3/skinvariables-shortcut-homewidgets.json
    shortcuts:
      - guid: coreelec-home-inprogress-movies
        playlist: InProgressMovies90Days.xsp
        target: videos
      - guid: coreelec-home-inprogress-shows
        playlist: InProgressShows90Days.xsp
        target: videos
      - guid: coreelec-home-recently-aired-shows
        playlist: RecentlyAiredEpisodes30Days.xsp
        target: videos
      - guid: coreelec-home-recently-released-movies
        playlist: RecentlyReleasedMoviesCurrentAndPreviousYear.xsp
        target: videos
      - guid: coreelec-home-new-shows
        playlist: NewShows.xsp
        target: videos
      - guid: coreelec-home-new-movies
        playlist: NewMovies.xsp
        target: videos

  # The TV Shows hub, 1101.
  - document: /storage/.kodi/userdata/addon_data/script.skinvariables/nodes/skin.arctic.fuse.3/skinvariables-shortcut-1101widgets.json
    shortcuts:
      - guid: coreelec-tv-inprogress
        playlist: InProgressShows90Days.xsp
        target: videos
      - guid: coreelec-tv-recently-aired
        playlist: RecentlyAiredEpisodes30Days.xsp
        target: videos
      - guid: coreelec-tv-trakt-popular
        playlist: TraktPopularTVShows.xsp
        target: videos
      - guid: coreelec-tv-new
        playlist: NewShows.xsp
        target: videos

  # The Movies hub, 1102.
  - document: /storage/.kodi/userdata/addon_data/script.skinvariables/nodes/skin.arctic.fuse.3/skinvariables-shortcut-1102widgets.json
    shortcuts:
      - guid: coreelec-movies-inprogress
        playlist: InProgressMovies90Days.xsp
        target: videos
      - guid: coreelec-movies-recently-released
        playlist: RecentlyReleasedMoviesCurrentAndPreviousYear.xsp
        target: videos
      - guid: coreelec-movies-trakt-box-office
        playlist: TraktWeekendBoxOffice.xsp
        target: videos
      - guid: coreelec-movies-new
        playlist: NewMovies.xsp
        target: videos

  # The TV Shows hub's submenu, which pivots the library. Selecting the hub
  # itself opens the library root (HomeSwitcher.1101.Shortcut.Path in
  # settings.yaml); pressing up on it opens this list instead. The skin
  # compiles each top-level item into `skinvariables-1101submenu-staticitems`.
  #
  # These are `videodb://` paths rather than `library://` nodes, the same as
  # the hub's own shortcut: the Device's userdata library overrides Kodi's
  # nodes, and these views should not depend on what is in it.
  - document: /storage/.kodi/userdata/addon_data/script.skinvariables/nodes/skin.arctic.fuse.3/skinvariables-shortcut-1101submenu.json
    shortcuts:
      - guid: coreelec-tv-submenu-years
        path: videodb://tvshows/years/
        label: "$LOCALIZE[652]"
        icon: special://skin/extras/icons/year.png
        target: videos
      - guid: coreelec-tv-submenu-genres
        path: videodb://tvshows/genres/
        label: "$LOCALIZE[135]"
        icon: special://skin/extras/icons/genre.png
        target: videos
      - guid: coreelec-tv-submenu-recently-added
        path: videodb://recentlyaddedepisodes/
        label: "$LOCALIZE[20382]"
        icon: special://skin/extras/icons/recentlyadded.png
        target: videos

  # The Movies hub's submenu: the same three pivots, movie values.
  - document: /storage/.kodi/userdata/addon_data/script.skinvariables/nodes/skin.arctic.fuse.3/skinvariables-shortcut-1102submenu.json
    shortcuts:
      - guid: coreelec-movies-submenu-years
        path: videodb://movies/years/
        label: "$LOCALIZE[652]"
        icon: special://skin/extras/icons/year.png
        target: videos
      - guid: coreelec-movies-submenu-genres
        path: videodb://movies/genres/
        label: "$LOCALIZE[135]"
        icon: special://skin/extras/icons/genre.png
        target: videos
      - guid: coreelec-movies-submenu-recently-added
        path: videodb://recentlyaddedmovies/
        label: "$LOCALIZE[20382]"
        icon: special://skin/extras/icons/recentlyadded.png
        target: videos

  # The power menu. Every entry is a Kodi builtin rather than a playlist, and
  # every label is a Kodi localisation reference so the menu follows the
  # interface language.
  - document: /storage/.kodi/userdata/addon_data/script.skinvariables/nodes/skin.arctic.fuse.3/skinvariables-shortcut-powermenu.json
    shortcuts:
      - guid: coreelec-power-poweroff
        path: Powerdown()
        label: "$LOCALIZE[13016]"
        icon: special://skin/extras/icons/power.png
      - guid: coreelec-power-timer
        path: AlarmClock(shutdowntimer,Shutdown())
        label: "$LOCALIZE[20150]"
        icon: special://skin/extras/icons/timer.png
      - guid: coreelec-power-suspend
        path: Suspend()
        label: "$LOCALIZE[13011]"
        icon: special://skin/extras/icons/power.png
      - guid: coreelec-power-reboot
        path: Reset()
        label: "$LOCALIZE[13013]"
        icon: special://skin/extras/icons/refresh.png
      # Kodi has no localisation string for this one, so the label is literal.
      - guid: coreelec-power-restart-kodi
        path: RestartApp()
        label: Restart Kodi
        icon: special://skin/extras/icons/refresh.png
