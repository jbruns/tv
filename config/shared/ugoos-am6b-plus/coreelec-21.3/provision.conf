# CoreELEC provisioning - shared baseline
# Platform: Ugoos AM6B Plus (Amlogic S922X-J, aarch64)
# Image:    CoreELEC 21.3 "Omega" (Amlogic-ne)
#
# This file is committed to the repository and MUST NOT contain secrets.
# Per-room overrides live in config/rooms/<room>.conf; secrets live outside
# the repository in the operator secrets file.
#
# ---------------------------------------------------------------------------
# Add-on artifact lock
# ---------------------------------------------------------------------------
# Every ADDON_ARTIFACT record is id|version|https-url|sha256.
#
# The lock is a closure: it contains the selected add-ons, every add-on they
# require transitively, and the repository add-ons that keep them
# discoverable/updatable in the Kodi UI. Versions and digests were resolved
# from primary repository indexes on 2026-09-05 and every digest below was
# computed from the exact bytes served by the URL on the same line.
#
# Resolution sources. Each repository index below is the `<info>` URL declared
# inside that repository add-on's own addon.xml, and each datadir is its
# matching `<datadir>`; all were fetched over HTTPS and confirmed to return
# 200 on 2026-09-05.
#   Kodi Omega mirror  index   https://mirrors.kodi.tv/addons/omega/addons.xml.gz
#                      datadir https://mirrors.kodi.tv/addons/omega/
#   CoreELEC 21.3      index   https://addons.coreelec.org/Amlogic-ne/21.3/aarch64/addons.xml.gz
#                      datadir https://addons.coreelec.org/Amlogic-ne/21.3/aarch64/
#   Emby beta (Omega)  index   https://embydata.com/downloads/addons/xbmb3c/multi-repo/beta/v21_omega/addons.xml
#                      datadir https://embydata.com/downloads/addons/xbmb3c/multi-repo/beta/v21_omega/
#   jurialmunkey       index   https://raw.githubusercontent.com/jurialmunkey/repository.jurialmunkey/master/omega/zips/addons.xml
#                      datadir https://raw.githubusercontent.com/jurialmunkey/repository.jurialmunkey/master/omega/zips/
#   Don't Panic        index   https://raw.githubusercontent.com/pannal/dontpanickodi/master/omega/zips/addons.xml
#                      datadir https://raw.githubusercontent.com/pannal/dontpanickodi/master/omega/zips/
#
# https://pm4k.eu/omega/zips/ is a byte-identical mirror of the Don't Panic
# Omega datadir and serves the same addons.xml; the raw.githubusercontent.com
# location above is the canonical one declared by repository.dontpanic 0.2.10.
# (https://pm4k.eu/omega/addons.xml, without the /zips/ segment, returns 404;
# do not cite it as an index.)
#
# Kodi-bundled dependencies are intentionally absent from this lock because
# they ship inside the CoreELEC image and cannot be installed as repository
# artifacts. They are declared in Kodi's system/addon-manifest.xml (Omega):
#   script.module.pil, script.module.pycryptodome, script.module.simplejson,
#   resource.language.en_gb, skin.estuary, and the xbmc.* API providers.
#
# ---------------------------------------------------------------------------
# Pins served from immutable upstream archives rather than a repository ZIP
# ---------------------------------------------------------------------------
# Two requested versions are not published as versioned ZIPs in any add-on
# repository index. Both are pinned to an official, immutable GitHub archive
# of the publisher's own repository, with the exact SHA-256 recorded below.
# Both archives were re-downloaded to confirm the bytes are reproducible.
#
# script.plexmod=1.14.1-beta1
#   Source: https://codeload.github.com/pannal/plex-for-kodi/zip/2707bbe72a7ea829b69bdd7ebb753c700552b4d0
#   Commit: 2707bbe72a7ea829b69bdd7ebb753c700552b4d0 (branch develop_kodi21,
#           committed 2026-07-27), whose addon.xml declares
#           id="script.plexmod" version="1.14.1-beta1".
#   Rationale: the canonical "Don't Panic" Omega index
#     (https://raw.githubusercontent.com/pannal/dontpanickodi/master/omega/zips/addons.xml)
#     publishes script.plexmod only up to 1.3.19, and the GitHub releases/tags
#     for pannal/plex-for-kodi carry no 1.14.1-beta1 asset. The requested
#     version exists only on the develop_kodi21 branch. The branch ref moves,
#     so the archive is addressed by its commit SHA, which does not.
#   repository.dontpanic is locked below so the add-on stays discoverable and
#   updatable from the Kodi UI once a packaged release ships.
#
# weather.ha=0.0.6.6
#   Source: https://codeload.github.com/Eugeniusz-Gienek/kodi_weather_ha/zip/refs/tags/0.0.6.6
#   Rationale: https://mirrors.kodi.tv/addons/omega/weather.ha/ publishes only
#     0.0.5, 0.0.6.3 and 0.0.6.4.1, and the upstream 0.0.6.6 release carries no
#     attached asset. The tag archive is the publisher's own immutable
#     distribution of that exact tag; its addon.xml declares id="weather.ha"
#     version="0.0.6.6".
#
# Both archives use GitHub's `<repo>-<ref>/` top-level directory rather than
# `<addon-id>/`; see the packaging notes at the bottom of this file.
#
# ---------------------------------------------------------------------------
# Canonical repackaging accepted (documented deviation)
# ---------------------------------------------------------------------------
# pvr.nextpvr is locked at 21.3.2.1 rather than the requested 21.3.2.
# aarch64/Linux binary add-ons are not published on Kodi's mirror (only
# android/darwin/windows builds exist there), so the only first-party source
# for this platform is CoreELEC's own add-on server. CoreELEC builds upstream
# 21.3.2 and appends its package revision:
#   https://raw.githubusercontent.com/CoreELEC/CoreELEC/coreelec-21/packages/mediacenter/kodi-binary-addons/pvr.nextpvr/package.mk
#     PKG_VERSION="21.3.2-Omega"
#     PKG_REV="1"
# The add-on metadata (id, provider, requires) is identical to upstream
# 21.3.2; only the trailing CoreELEC revision differs.

# --- Platform / release guard ---------------------------------------------
EXPECTED_RELEASE=21.3

# --- Regional baseline ------------------------------------------------------
TIMEZONE_COUNTRY=United States
TIMEZONE=America/Los_Angeles
LOCALE_LANGUAGE=resource.language.en_us
LOCALE_COUNTRY=USA (12h)
KEYBOARD_LAYOUT=English QWERTY

# --- Connection / service defaults -----------------------------------------
SSH_PORT=22
KODI_PORT=8080
# The Kodi web-interface account Home Assistant authenticates as.
KODI_USER=homeassistant
APPLY_KODI=1
HARDEN_SSH=1

# --- Add-on update policy ---------------------------------------------------
# notify = Kodi surfaces available updates but never installs them silently,
# so the pinned versions above stay authoritative.
ADDON_UPDATE_MODE=notify

# --- Non-secret service endpoints -------------------------------------------
# Site-specific; uncomment and set per deployment. Leaving them unset keeps
# the corresponding configuration steps inert. Tokens/passwords for these
# services belong in the operator secrets file, never here.
#HOME_ASSISTANT_URL=https://homeassistant.example.lan:8123
#NEXTPVR_HOST=nextpvr.example.lan
#PLEX_SERVER_URL=https://plex.example.lan:32400
#EMBY_SERVER_URL=https://emby.example.lan:8096

