# --- Packaging notes for the deployment step --------------------------------
# Four artifacts have an archive top-level directory that differs from the
# add-on id, so deployment must install to <addons>/<addon-id>/ using the id
# declared in addon.xml rather than the directory name inside the ZIP:
#   plugin.service.emby-next-gen -> plugin.video.emby-plugin.service.emby-next-gen_11.1.27/
#   resource.font.robotocjksc    -> resource.font.robotcjksc/   (upstream typo)
#   script.plexmod               -> script.plexmod/
#   weather.ha                   -> kodi_weather_ha-0.0.6.6/
#
# --- Dependency floors satisfied by this lock -------------------------------
# script.plexmod 1.3.19 requires script.module.requests>=2.27.1+matrix.1,
# script.module.six>=1.15.0+matrix.1 and script.module.kodi-six>=0.1.3.1.
# weather.ha 0.0.6.6 requires script.module.requests>=2.27.1,
# script.module.iso8601>=0.1.12, script.module.yaml>=5.3.0 and
# script.module.dateutil>=2.8.1; script.module.dateutil 2.8.2 in turn requires
# script.module.six>=1.15.0+matrix.1. Each is locked at the highest version
# published in the Kodi Omega index that satisfies the floor, which is the
# version Kodi's own resolver would install.
