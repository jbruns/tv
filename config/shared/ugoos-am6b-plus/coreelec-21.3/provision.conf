# CoreELEC provisioning - shared baseline
# Platform: Ugoos AM6B Plus (Amlogic S922X-J), 32-bit arm userspace
# Image:    CoreELEC 21.3 "Omega" (Amlogic-ng, arm)
#
# This file is committed to the repository and MUST NOT contain secrets.
# Per-room overrides live in config/rooms/<room>.conf; secrets live in the
# gitignored repository-root .env file.
#
# ---------------------------------------------------------------------------
# Add-on artifact lock
# ---------------------------------------------------------------------------
# Every ADDON_ARTIFACT record is id|version|https-url|sha256.
#
# The lock is a closure: it contains the selected add-ons, every add-on they
# require transitively, and the repository add-ons that keep them
# discoverable/updatable in the Kodi UI. Versions and digests were resolved
# from primary repository indexes on 2026-09-05 and every digest below was
# computed from the exact bytes served by the URL on the same line.
#
# Resolution sources. Each repository index below is the `<info>` URL declared
# inside that repository add-on's own addon.xml, and each datadir is its
# matching `<datadir>`; all were fetched over HTTPS and confirmed to return
# 200 on 2026-09-05.
#   Kodi Omega mirror  index   https://mirrors.kodi.tv/addons/omega/addons.xml.gz
#                      datadir https://mirrors.kodi.tv/addons/omega/
#   CoreELEC 21.3      index   https://addons.coreelec.org/Amlogic-ng/21.3/arm/addons.xml.gz
#                      datadir https://addons.coreelec.org/Amlogic-ng/21.3/arm/
#   Emby stable (Omega) index  https://embydata.com/downloads/addons/xbmb3c/multi-repo/release/v21_omega/addons.xml
#                       datadir https://embydata.com/downloads/addons/xbmb3c/multi-repo/release/v21_omega/
#   jurialmunkey       index   https://raw.githubusercontent.com/jurialmunkey/repository.jurialmunkey/master/omega/zips/addons.xml
#                      datadir https://raw.githubusercontent.com/jurialmunkey/repository.jurialmunkey/master/omega/zips/
#   Don't Panic        index   https://raw.githubusercontent.com/pannal/dontpanickodi/master/omega/zips/addons.xml
#                      datadir https://raw.githubusercontent.com/pannal/dontpanickodi/master/omega/zips/
#
# https://pm4k.eu/omega/zips/ is a byte-identical mirror of the Don't Panic
# Omega datadir and serves the same addons.xml; the raw.githubusercontent.com
# location above is the canonical one declared by repository.dontpanic 0.2.10.
# (https://pm4k.eu/omega/addons.xml, without the /zips/ segment, returns 404;
# do not cite it as an index.)
#
# Kodi-bundled dependencies are intentionally absent from this lock because
# they ship inside the CoreELEC image and cannot be installed as repository
# artifacts. They are declared in Kodi's system/addon-manifest.xml (Omega):
#   script.module.pil, script.module.pycryptodome, script.module.simplejson,
#   resource.language.en_gb, skin.estuary, and the xbmc.* API providers.
#
# ---------------------------------------------------------------------------
# Pins served from immutable upstream archives rather than a repository ZIP
# ---------------------------------------------------------------------------
# These artifacts are pinned to immutable GitHub objects in the publishers'
# own repositories, with the exact SHA-256 recorded below. Each object was
# re-downloaded to confirm the bytes are reproducible.
#
# script.plexmod=1.3.19
#   Source: https://raw.githubusercontent.com/pannal/dontpanickodi/eba134ac09bfe4916b3511d1e377bf6bb03a947e/omega/zips/script.plexmod/script.plexmod-1.3.19.zip
#   Commit: eba134ac09bfe4916b3511d1e377bf6bb03a947e in the publisher's
#           canonical Don't Panic Omega repository, committed 2026-03-16.
#   Rationale: 1.3.19 is the latest published stable PM4K release. The
#     immutable commit URL avoids trusting the moving master branch while
#     preserving the publisher's exact repository package.
#
# weather.ha=0.0.6.6
#   Source: https://codeload.github.com/Eugeniusz-Gienek/kodi_weather_ha/zip/refs/tags/0.0.6.6
#   Rationale: https://mirrors.kodi.tv/addons/omega/weather.ha/ publishes only
#     0.0.5, 0.0.6.3 and 0.0.6.4.1, and the upstream 0.0.6.6 release carries no
#     attached asset. The tag archive is the publisher's own immutable
#     distribution of that exact tag; its addon.xml declares id="weather.ha"
#     version="0.0.6.6".
#   Patches: the provisioner rewrites the `ha_request_attempts` setting type
#     for Kodi 21 and inserts the missing `continue` in the request retry loop
#     of lib/homeassistant/_adapter.py. Without that `continue`, `r` stays
#     unbound whenever the request raises, so the `if not r.ok` check below the
#     handler turns an unreachable Home Assistant into an UnboundLocalError
#     that escapes the add-on's own RequestError handling. Both patches assert
#     this exact version and source structure and fail the transaction
#     otherwise, so a version bump requires re-reviewing them.
#
# Both archives use GitHub's `<repo>-<ref>/` top-level directory rather than
# `<addon-id>/`; see the packaging notes at the bottom of this file.
#
# ---------------------------------------------------------------------------
# Canonical repackaging accepted (documented deviation)
# ---------------------------------------------------------------------------
# pvr.nextpvr is locked at 21.3.2.1 rather than the requested 21.3.2.
# Linux/arm binary add-ons are not published on Kodi's mirror (only
# android/darwin/windows builds exist there), so the only first-party source
# for this platform is CoreELEC's own add-on server. CoreELEC builds upstream
# 21.3.2 and appends its package revision:
#   https://raw.githubusercontent.com/CoreELEC/CoreELEC/coreelec-21/packages/mediacenter/kodi-binary-addons/pvr.nextpvr/package.mk
#     PKG_VERSION="21.3.2-Omega"
#     PKG_REV="1"
# The add-on metadata (id, provider, requires) is identical to upstream
# 21.3.2; only the trailing CoreELEC revision differs.

# --- Platform / release guard ---------------------------------------------
EXPECTED_RELEASE=21.3

# --- Regional baseline ------------------------------------------------------
TIMEZONE_COUNTRY=United States
TIMEZONE=America/Los_Angeles
LOCALE_LANGUAGE=resource.language.en_us
LOCALE_COUNTRY=USA (12h)
KEYBOARD_LAYOUT=English QWERTY

# --- Audio output -----------------------------------------------------------
# Stated as intent, not as the concrete ALSA string. The concrete value embeds
# the kernel card name (AMLAUGESOUND on this hardware), which is a driver
# detail rather than a stable fact, so the pre-transaction audio probe resolves
# the intent against the enumeration the running Kodi actually offers.
#
# hdmi-multichannel is ALSA surround71: multichannel PCM over HDMI, which is
# what decoded (non-bitstreamed) audio needs. Passthrough bitstreams go out the
# plain hdmi device.
AUDIO_DEVICE=hdmi-multichannel
AUDIO_PASSTHROUGH_DEVICE=hdmi

# --- Connection / service defaults -----------------------------------------
SSH_PORT=22
KODI_PORT=8080
# The Kodi web-interface account Home Assistant authenticates as.
KODI_USER=homeassistant
APPLY_KODI=1
HARDEN_SSH=1

# --- Home Assistant ---------------------------------------------------------
HOME_ASSISTANT_WEATHER_ENTITY=weather.openweathermap
HOME_ASSISTANT_SUN_ENTITY=sun.sun

# --- NextPVR backend address ------------------------------------------------
# The host and PIN are secrets and live in the shared .env file; the address
# the client dials is a non-secret deployment fact and belongs here. Both are
# required whenever NEXTPVR_HOST is set: provisioning does not guess a backend
# address, because a guess that happens to be plausible points the client at
# nothing and is not caught until Kodi disables the add-on.
#
# This backend is served over HTTPS on 443, not NextPVR's stock 8866/http.
NEXTPVR_PORT=443
NEXTPVR_PROTOCOL=https

# --- Add-on update policy ---------------------------------------------------
# notify = Kodi surfaces available updates but never installs them silently,
# so the pinned versions above stay authoritative.
ADDON_UPDATE_MODE=notify

# --- Acknowledged unmanaged add-ons -----------------------------------------
# Every run reports the add-ons installed on the device that no
# ADDON_ARTIFACT above names. Listing one here acknowledges it: the report
# still inventories it, but it stops counting as drift. The point of the count
# is that a non-zero value means something arrived that nobody decided on, so
# anything expected on every device of this profile belongs here.
#
# The metadata scrapers are installed by Kodi itself on first boot and are
# present on any CoreELEC 21.3 image. The autocompletion pair is a deliberate
# manual install from the official Kodi repository.
ADDON_UNMANAGED_ALLOWED=metadata.album.universal,metadata.artists.universal,metadata.common.fanart.tv,metadata.generic.albums,metadata.generic.artists,metadata.themoviedb.org.python,metadata.tvshows.themoviedb.org.python,plugin.program.autocompletion,script.module.autocompletion

