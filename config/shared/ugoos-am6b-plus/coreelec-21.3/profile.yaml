# Reconciler-owned Desired State for the Ugoos AM6B+ / CoreELEC 21.3 Profile.
#
# This file says what a Device in this Profile is, what it is called, how to
# reach it, and who may log in. What it declares for the Device is in four files
# beside it, one concern each: playlists.yaml, shortcuts.yaml, documents.yaml and
# settings.yaml. All five are required.

profile: ugoos-am6b-plus/coreelec-21.3

# What a Device in this Profile is claimed to be. Every Run asserts it against
# the Device before anything is planned; which file holds which key is the
# Reconciler's business.
#
# None of this is derived from the directory name above. `ugoos-am6b-plus` is
# for humans, and the Device's own model string is `UGOOS AM6`, with no "plus"
# in it.
platform:
  id: coreelec
  version: "21.3"
  device: Amlogic-ng
  release_contains: Amlogic-ng.arm-21.3-Omega
  # The kernel's id for this board's sound card, as /proc/asound/cards lists
  # it. The audio device strings below embed it, and Kodi given a card the
  # Device does not have falls back to another output in silence (ADR 0019).
  sound_card: AMLAUGESOUND

# Facts more than one State Address takes. Stating one twice is two records
# free to diverge, and the symptom here is quiet: Kodi showing one timezone
# and the operating system another.
#
# A Profile Constant is not a Named Value. It is committed, reviewable and
# printed by a Run; a Named Value is none of those (ADR 0014).
constants:
  timezone: America/Los_Angeles

# The Device addresses the Reconciler knows the meaning of, but not the
# location of. Every other address on the Device reaches the Reconciler as
# the State Address of a Resource; these five do not, because what they are
# for is mechanism — which unit reads a document, where Kodi keeps add-ons,
# which database holds their enabled flags, where Kodi lists the add-ons it
# ships with — and mechanism is not declared (ADR 0013).
#
# Knowing what an address means is not knowing where it is, though, so the
# address itself is here. The Kodi add-on database carries its schema version
# in its filename, so a Profile branched for a future Kodi changes one line
# rather than forking the Reconciler (ADR 0018). No Device address lives in
# code.
addresses:
  timezone_cache: /storage/.cache/timezone
  sshd_conf: /storage/.cache/services/sshd.conf
  addons: /storage/.kodi/addons
  addon_database: /storage/.kodi/userdata/Database/Addons33.db
  # Kodi's own list of the add-ons it ships with. They live under the same
  # address as everything else and nobody pinned them, so without this file
  # the Run would report seven ordinary scrapers as strays.
  addon_manifest: /usr/share/kodi/system/addon-manifest.xml

# Controller-side SSH transport. The Reconciler invokes ssh and reuses
# the existing key-only administrator setup.
transport:
  user: root
  port: 22
  identity: ~/.ssh/coreelec_admin_ed25519

# Who may log in to a Device in this Profile, declared whole. An entry nobody
# declares here is removed from the Device, which is what makes a revoked key
# actually revoked.
#
# The administrator entry is not here and cannot be. It is derived from the
# public half of the identity above, because a Profile that can name an
# administrator key can name the wrong one and lock the Reconciler out of its
# own Device (ADR 0016).
authorized_keys:
  document: /storage/.ssh/authorized_keys
  entries:
    # Home Assistant's key for the Kodi lifecycle gateway. `restrict` is
    # implied by the entry, and the forced command is the only program this
    # key may ever run — the gateway declared in documents.yaml.
    #
    # The public key is a per-deployment value, so it is named rather than
    # held. It is not a secret, and the `.env` boundary is the file rather
    # than a judgement about each key (ADR 0016).
    - comment: homeassistant-ugoos-kodi-lifecycle
      from_env: COREELEC_LIFECYCLE_PUBLIC_KEY
      forced_command: /storage/.config/kodi-lifecycle
