# Reconciler-owned Desired State for the Ugoos AM6B+ / CoreELEC 21.3 Profile.
#
# This file is read by the Reconciler only. The shell entry points keep reading
# provision.conf in this directory, which is left untouched as the Recovery
# Baseline (ADR 0010).

profile: ugoos-am6b-plus/coreelec-21.3

# Controller-side SSH transport. The Reconciler shells out to ssh and reuses
# the existing key-only administrator setup.
transport:
  user: root
  port: 22
  identity: ~/.ssh/coreelec_admin_ed25519

# Kodi Smart Playlists. The directory is the physical path behind
# special://profile/playlists/video on CoreELEC.
smart_playlists:
  directory: /storage/.kodi/userdata/playlists/video
  playlists:
    - file: NewShows.xsp
      name: New Shows
      type: tvshows
      match: all
      limit: 50
      order:
        field: dateadded
        direction: descending
      rules:
        - field: playcount
          operator: is
          value: "0"

# Kodi settings inside guisettings.xml. That document is shared: everything
# not declared here is Unmanaged State and is preserved. Each value matches
# what provision-coreelec.sh writes, so the Recovery Baseline and Desired
# State do not diverge and a shell run remains a no-op (ADR 0010).
#
# Applying any of these restarts Kodi, because Kodi rewrites guisettings.xml
# from memory when it exits and would otherwise discard the write.
kodi_settings:
  document: /storage/.kodi/userdata/guisettings.xml
  settings:
    - setting: videolibrary.flattentvshows
      value: "1"
