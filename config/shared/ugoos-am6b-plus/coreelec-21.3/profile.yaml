# Reconciler-owned Desired State for the Ugoos AM6B+ / CoreELEC 21.3 Profile.
#
# This file is read by the Reconciler only. The shell entry points keep reading
# provision.conf in this directory, which is left untouched as the Recovery
# Baseline (ADR 0010).

profile: ugoos-am6b-plus/coreelec-21.3

# Controller-side SSH transport. The Reconciler shells out to ssh and reuses
# the existing key-only administrator setup.
transport:
  user: root
  port: 22
  identity: ~/.ssh/coreelec_admin_ed25519

# Kodi Smart Playlists. The directory is the physical path behind
# special://profile/playlists/video on CoreELEC. Each file is one State
# Address, listed in the order provision-coreelec.sh writes them so the two
# sides read side by side.
#
# RecentlyReleasedMovies90Days.xsp and RecentlyReleasedMoviesCurrentYear.xsp
# are absent on purpose. The shell deletes both because a newer playlist
# superseded them, and a factory-fresh Device never had either; declaring
# either would ask for a Managed Absence the Reconciler does not have and does
# not yet need (ADR 0012).
smart_playlists:
  directory: /storage/.kodi/userdata/playlists/video
  playlists:
    - file: InProgressMovies90Days.xsp
      name: In-Progress Movies
      type: movies
      match: all
      limit: 50
      order:
        field: lastplayed
        direction: descending
      rules:
        # `inprogress` is a boolean field: the operator carries the whole
        # test and Kodi writes no value element.
        - field: inprogress
          operator: "true"
          value: ""
        - field: lastplayed
          operator: inthelast
          value: 90 days

    - file: InProgressShows90Days.xsp
      name: In-Progress Shows
      type: tvshows
      match: all
      limit: 50
      order:
        field: lastplayed
        direction: descending
      rules:
        - field: inprogress
          operator: "true"
          value: ""
        - field: lastplayed
          operator: inthelast
          value: 90 days

    - file: RecentlyAiredEpisodes30Days.xsp
      name: Recently Aired Shows
      type: episodes
      match: all
      limit: 50
      order:
        field: year
        direction: descending
      rules:
        - field: airdate
          operator: inthelast
          value: 30 days
        # A negative window excludes episodes dated in the future, which a
        # scraper produces for a season already listed but not yet aired.
        - field: airdate
          operator: notinthelast
          value: -1 days

    - file: RecentlyReleasedMoviesCurrentAndPreviousYear.xsp
      name: Recently Released Movies
      type: movies
      match: all
      limit: 50
      order:
        field: year
        direction: descending
      rules:
        # The current and the previous release year. Kodi's `year` field is
        # numeric and has no relative operator, so the two bounds are offsets
        # from the current year, resolved on every read. A literal here would
        # be correct until 1 January and then disagree with the shell, which
        # renders the same two bounds from today's date, for the rest of the
        # year.
        - field: year
          operator: greaterthan
          value: -2
          relative_to: current_year
        - field: year
          operator: lessthan
          value: 1
          relative_to: current_year

    - file: TraktPopularTVShows.xsp
      name: Trakt Popular TV Shows
      type: tvshows
      match: all
      limit: 25
      order:
        field: dateadded
        direction: descending
      rules:
        - field: tag
          operator: contains
          value: trakt-popular

    - file: TraktWeekendBoxOffice.xsp
      name: Trakt Weekend Box Office
      type: movies
      match: all
      limit: 25
      order:
        field: dateadded
        direction: descending
      rules:
        - field: tag
          operator: contains
          value: trakt-weekend-box-office

    - file: NewShows.xsp
      name: New Shows
      type: tvshows
      match: all
      limit: 50
      order:
        field: dateadded
        direction: descending
      rules:
        - field: playcount
          operator: is
          value: "0"

    - file: NewMovies.xsp
      name: New Movies
      type: movies
      match: all
      limit: 50
      order:
        field: dateadded
        direction: descending
      rules:
        - field: playcount
          operator: is
          value: "0"

# Kodi settings, grouped by the Settings Document that holds them. A Settings
# Document is shared: everything not declared here is Unmanaged State and is
# preserved. Each document declares how it is serialised; the dialect is
# declared and never sniffed, so a corrupt or truncated document fails naming
# itself instead of reading as a plausible other shape.
#
# Each value matches what provision-coreelec.sh writes, so the Recovery
# Baseline and Desired State do not diverge and a shell run remains a no-op
# (ADR 0012). Adding a setting is an entry here and no code change; the two
# Device checks that go with it are in docs/operations/reconcile-theater.md.
#
# A setting states `value` or `from_env`, never both. `from_env` names a key
# in the shared .env file, which is where a value this committed file may not
# carry lives (ADR 0014). The value is read before any Device contact and is
# never printed.
#
# Applying any of these restarts Kodi, because Kodi rewrites a Settings
# Document from memory when it exits and would otherwise discard the write.
# The stop belongs to the Resource Type and is never declared here
# (ADR 0013).
settings_documents:
  - document: /storage/.kodi/userdata/guisettings.xml
    dialect: guisettings
    settings:
      # Region and input.
      - setting: locale.language
        value: resource.language.en_us
      - setting: locale.country
        value: USA (12h)
      - setting: locale.keyboardlayouts
        value: English QWERTY
      - setting: locale.timezonecountry
        value: United States
      - setting: locale.timezone
        value: America/Los_Angeles
      # Add-on updates are notified, never installed unattended, so the
      # appliance never changes underneath a viewer.
      - setting: general.addonupdates
        value: "1"
      - setting: input.enablemouse
        value: "false"
      # File lists: a ten-foot interface, not a file manager.
      - setting: filelists.showaddsourcebuttons
        value: "false"
      - setting: filelists.showextensions
        value: "false"
      - setting: filelists.showparentdiritems
        value: "false"
      # Video library presentation.
      - setting: videolibrary.flattentvshows
        value: "1"
      - setting: videolibrary.ignorevideoextras
        value: "true"
      - setting: videolibrary.ignorevideoversions
        value: "true"
      - setting: videolibrary.showallitems
        value: "false"
      - setting: videolibrary.tvshowsselectfirstunwatcheditem
        value: "1"
      # Playback follows the source frame rate and the display's clock.
      - setting: videoplayer.adjustrefreshrate
        value: "2"
      - setting: videoplayer.usedisplayasclock
        value: "false"
      # These name add-ons the shell installs. The Reconciler never runs on a
      # bare Device, so nothing here installs them; an add-on that is missing
      # shows up as a setting Kodi discards, which the hardware acceptance run
      # catches.
      - setting: lookandfeel.skin
        value: skin.arctic.fuse.3
      - setting: lookandfeel.soundskin
        value: resource.uisounds.fromashes
      # The shell writes this one only when weather is configured. It always
      # is on this fleet, so declaring it unconditionally matches the Device.
      - setting: weather.addon
        value: weather.ha

  # The Home Assistant weather add-on. Its settings definition carries no
  # version attribute, so Kodi loads and writes this document in the old flat
  # form: the value is an attribute, not element text.
  #
  # ha_server and ha_key name their values in .env rather than holding them.
  # The token is a credential; the endpoint sits beside it behind the same
  # boundary (ADR 0014).
  - document: /storage/.kodi/userdata/addon_data/weather.ha/settings.xml
    dialect: addon_v1
    settings:
      - setting: ha_server
        from_env: HOME_ASSISTANT_URL
      - setting: ha_key
        from_env: HOME_ASSISTANT_TOKEN
      - setting: ha_weather_forecast_entity_id
        value: weather.openweathermap
      - setting: ha_sun_entity_id
        value: sun.sun

  # The NextPVR client's first instance. Kodi 21 has no pvrmanager.enabled
  # setting: the PVR manager starts from an enabled client instance, so this
  # document carries the enable.
  #
  # host and pin name their values, for the same reason as weather.ha's two.
  - document: /storage/.kodi/userdata/addon_data/pvr.nextpvr/instance-settings-1.xml
    dialect: addon_v2
    settings:
      - setting: host
        from_env: NEXTPVR_HOST
      - setting: hostprotocol
        value: https
      - setting: port
        value: "443"
      - setting: pin
        from_env: NEXTPVR_PIN
      - setting: kodi_addon_instance_enabled
        value: "true"
      - setting: kodi_addon_instance_name
        value: NextPVR

  # TMDb Helper's metadata provider credentials. Both name their values, so
  # this whole document is named and none of it is held here. The shell writes
  # these two addresses and nothing else in the file.
  - document: /storage/.kodi/userdata/addon_data/plugin.video.themoviedb.helper/settings.xml
    dialect: addon_v2
    settings:
      - setting: mdblist_apikey
        from_env: MDBLIST_API_KEY
      - setting: omdb_apikey
        from_env: OMDB_API_KEY
