# The Artifact Lock for the Ugoos AM6B+ / CoreELEC 21.3 Profile.
#
# One record per add-on: the version this Profile installs, the URL the
# archive comes from, and the SHA-256 of the bytes that URL must return. A
# fetch returning anything else fails the Run rather than installing
# (ADR 0017).
#
# Appearing here is the statement that the add-on should be installed at this
# version *and* enabled. The two are never independently desirable, so they
# are one declaration that cannot disagree with itself (ADR 0018).
#
# This is a lock file, not a manifest. It lives beside the Profile's other
# files rather than inside one because an Action will eventually rewrite it to propose
# version bumps, and a bot editing the file humans edit for settings turns
# every bump into a conflict with unrelated work.
#
# Two fields answer two different questions, and only a human reads either.
# `role` answers "why is this add-on here at all": `chosen` is a decision
# someone made, `dependency` is a consequence of one, and `repository` is the
# kind whose enablement could invite Kodi to go and fetch something. `notes`
# answers "why this version and not the newest", and a record with nothing to
# explain states `~`. Most of these say `~`: a pin is a known-good version
# someone ran, and "newest" is a question for the update proposer, not a claim
# this file makes.
#
# Three add-ons carry Artifact Patches: upstream has broken them, and they
# cannot be correct without four one-line fixes. The diffs are in patches/,
# the record lists the ones it applies, and `patched_files` records what each
# diff produces — a patched add-on is observed by its version *and* by those
# hashes, because correcting a patch does not move the version. Those hashes
# are generated: run `record-patches` rather than editing them by hand.

addons:
