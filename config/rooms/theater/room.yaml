# Reconciler-owned Room Overlay for the theater Ugoos.
#
# The Device is identified by its hostname and nothing more. The Reconciler
# dials that name and refuses to plan against a Device whose own hostname
# disagrees with it.

room: theater
hostname: ugoos-theater
profile: ugoos-am6b-plus/coreelec-21.3

# Room-scoped Kodi settings, grouped by the Settings Document that holds them,
# exactly as the Profile groups its own. These ten State Addresses describe
# this room's hardware rather than the class of Device, so declaring them in a
# Profile shared by four rooms would be false. The Profile declares
# guisettings.xml too, and the two sides' settings merge into one document; an
# address declared on both sides is an error naming the document and the
# address.
#
# Applying any of these settings restarts Kodi, because Kodi rewrites
# guisettings.xml from memory when it exits.
#
# videoscreen.resolution is not here, and will not be. Kodi recomputes that
# ordinal from the live display mode at every startup, so writing it is not
# ownership; the mode Kodi actually keeps is videoscreen.screenmode, which
# nothing writes (ADR 0019).
settings_documents:
  - document: /storage/.kodi/userdata/guisettings.xml
    dialect: guisettings
    settings:
      # Every 2160p mode the Sony reports over EDID.
      - setting: videoscreen.whitelist
        value: 0409602160024.00000pstd,0409602160023.97602pstd,0384002160060.00000pstd,0384002160059.94006pstd,0384002160050.00000pstd,0384002160030.00000pstd,0384002160029.97003pstd,0384002160025.00000pstd,0384002160024.00000pstd,0384002160023.97602pstd
      # Dolby Vision is on in this room. Kodi's address states it negatively,
      # so the declaration is inverted on the way to the Device: `true` here
      # is disabledolbyvision=false there.
      - setting: coreelec.amlogic.disabledolbyvision
        value: "true"
        transform: invert
      # Display-led, because the Sony drives Dolby Vision. Kodi stores the
      # mode as an ordinal, so the mode name is mapped: tv-led is 0.
      - setting: coreelec.amlogic.dolbyvisionled
        value: tv-led
        transform: dolby_vision_mode
      # Audio passes through the Sony eARC and the OREI link to the Denon.
      # There is no Atmos flag: Atmos rides on TrueHD and E-AC-3.
      - setting: audiooutput.passthrough
        value: "true"
      - setting: audiooutput.ac3passthrough
        value: "true"
      - setting: audiooutput.eac3passthrough
        value: "true"
      - setting: audiooutput.dtspassthrough
        value: "true"
      - setting: audiooutput.truehdpassthrough
        value: "true"
      - setting: audiooutput.dtshdpassthrough
        value: "true"
      # 7.1, the room's speaker layout. `10` is AE_CH_LAYOUT_7_1 in the
      # fixed table in Kodi's own settings.xml; it is not an ordinal Kodi
      # assigns per Device, so it is as stable as the Kodi version.
      - setting: audiooutput.channels
        value: "10"
