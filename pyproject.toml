# No Python package exists yet. The Reconciler restarts as a walking skeleton
# in the first slice (ADR 0008); this file currently configures the tooling
# that checks the repository's remaining Python helpers.

[project]
name = "tv"
version = "0.0.0"
description = "CoreELEC Device configuration"
requires-python = ">=3.14"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "mypy>=2.3.1,<3",
  "ruff>=0.16.8,<0.17",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
  "scripts/check_shell_permissions.py",
  "scripts/shell_permissions.py",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
  "scripts/check_markdown.py",
  "tests/home-assistant-ugoos-fixture.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
