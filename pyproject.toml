[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[project]
name = "coreelec-reconciler"
version = "0.1.0"
description = "Reconcile CoreELEC Device Desired State"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "paramiko>=5.0.0,<6",
  "pydantic>=2.13.5,<3",
  "PyYAML>=6.0.3,<7",
]

[project.scripts]
coreelec-reconciler = "coreelec_reconciler.cli.main:main"

[dependency-groups]
dev = [
  "jinja2>=3.1.6,<4",
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.8,<0.17",
  "types-paramiko>=5.0.0.20260724,<5.1",
  "types-PyYAML>=6.0.12.20260906,<6.1",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests/scaffold", "tests/inventory", "tests/ci", "tests/unit"]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
  "scripts/check_inventory_milestones.py",
  "scripts/check_shell_permissions.py",
  "scripts/run_test_budget.py",
  "src",
  "tests/conftest.py",
  "tests/scaffold",
  "tests/inventory",
  "tests/ci",
  "tests/unit",
  "tests/support",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
  "scripts/check_markdown.py",
  "tests/home-assistant-ugoos-fixture.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
