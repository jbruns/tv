[project]
name = "coreelec-reconciler"
version = "0.1.0"
description = "Reconcile CoreELEC Devices with their declared Desired State"
requires-python = ">=3.14"
dependencies = [
  "pyyaml>=6.0.2,<7",
]

[project.scripts]
coreelec-reconciler = "coreelec_reconciler:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "coreelec_reconciler"

[dependency-groups]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=8.4.2,<9",
  "ruff>=0.16.8,<0.17",
  "types-pyyaml>=6.0.12,<7",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
  "src",
  "tests/unit",
  "scripts/check_shell_permissions.py",
  "scripts/shell_permissions.py",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
  "scripts/check_markdown.py",
  "tests/home-assistant-ugoos-fixture.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
