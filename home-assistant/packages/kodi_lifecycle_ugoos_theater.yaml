# The theater's Kodi Lifecycle: the blueprint instantiated for ugoos-theater.
# Import the blueprint first; see docs/home-assistant/ugoos-kodi-lifecycle.md.
input_boolean:
  ugoos_theater_keep_running_hold:
    name: Theater - Keep-Running Hold
    icon: mdi:play-lock

automation:
  - id: kodi_lifecycle_ugoos_theater
    alias: Theater - Kodi Lifecycle
    use_blueprint:
      path: jbruns/kodi_lifecycle.yaml
      input:
        display: media_player.sony_theater
        display_source: HDMI 4
        kodi: media_player.ugoos_theater
        ssh_host: ugoos-theater-lifecycle
        keep_running_hold: input_boolean.ugoos_theater_keep_running_hold

script:
  ugoos_theater_restart_kodi:
    alias: Theater - Restart Kodi
    icon: mdi:restart
    mode: single
    sequence:
      # A failed stop still goes on to start, so Kodi ends up running.
      - action: shell_command.kodi_lifecycle
        continue_on_error: true
        data:
          host: ugoos-theater-lifecycle
          command: stop
      - action: shell_command.kodi_lifecycle
        data:
          host: ugoos-theater-lifecycle
          command: start
