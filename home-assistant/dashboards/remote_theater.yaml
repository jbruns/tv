# The theater's Remote dashboard. Power goes to the Display. Every other key
# goes to select.theater_remote_keys, which sends it to Kodi, the Sony or the
# Denon (ADR 0025). `value` is the select option. The card's type is
# aiks-tv-card, whatever RosCard's README calls it. The card carries every field
# RosCard's editor saves, including a fixed uuid.
title: Theater Remote
views:
  - title: TV
    path: tv
    cards:
      - type: custom:aiks-tv-card
        uuid: b45de3be-a70a-4cb0-9834-ba3613d1d440
        tv_name: Theater
        tv_type: android_tv
        remote_version: x9
        media_play_entity: media_player.sony_theater
        source: select.theater_sony_apps
        background_path: ""
        list_elements:
          device_name: true
          icon: true
        entities:
          - {key: POWER_ON, type: media_player, entity_id: media_player.sony_theater, value: turn_on}
          - {key: POWER_OFF, type: media_player, entity_id: media_player.sony_theater, value: turn_off}
          - {key: UP, type: select, entity_id: select.theater_remote_keys, value: Up}
          - {key: DOWN, type: select, entity_id: select.theater_remote_keys, value: Down}
          - {key: LEFT, type: select, entity_id: select.theater_remote_keys, value: Left}
          - {key: RIGHT, type: select, entity_id: select.theater_remote_keys, value: Right}
          - {key: CENTER, type: select, entity_id: select.theater_remote_keys, value: Select}
          - {key: BACK, type: select, entity_id: select.theater_remote_keys, value: Back}
          - {key: HOME, type: select, entity_id: select.theater_remote_keys, value: Home}
          - {key: MENU, type: select, entity_id: select.theater_remote_keys, value: Menu}
          - {key: PLAY, type: select, entity_id: select.theater_remote_keys, value: Play}
          - {key: PAUSE, type: select, entity_id: select.theater_remote_keys, value: Pause}
          - {key: VOLUME_UP, type: select, entity_id: select.theater_remote_keys, value: VolumeUp}
          - {key: VOLUME_DOWN, type: select, entity_id: select.theater_remote_keys, value: VolumeDown}
          - {key: MUTE, type: select, entity_id: select.theater_remote_keys, value: Mute}
          - {key: UN_MUTE, type: select, entity_id: select.theater_remote_keys, value: Unmute}
