name: Offline CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python-offline:
    name: Python offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.3
          enable-cache: true
      - name: Synchronize frozen environment
        run: uv sync --frozen
      - name: Record environment
        run: |
          mkdir -p .ci-evidence
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$SOURCE_SHA"
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "checked_out_sha=${checked_out_sha}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uv --version
            uv run python --version
            uv run ruff --version
            uv run mypy --version
            uv run pytest --version
            uname -a
          } | tee .ci-evidence/environment.txt
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: >-
          uv run ruff format --check
          src scripts/run_test_budget.py scripts/check_inventory_milestones.py
          scripts/check_shell_permissions.py
          scripts/run_m3_pilot_harness.py scripts/verify_m3_evidence_bundle.py
          tests/scaffold tests/inventory tests/ci
          tests/unit tests/adapters tests/contracts tests/integration
          tests/conftest.py tests/support
      - name: Strict mypy
        run: uv run mypy
      - name: Validate inventory ownership ledger
        run: >-
          uv run python scripts/check_inventory_milestones.py
          > .ci-evidence/inventory-ledger.txt
      - name: Audit shell permissions
        run: >-
          python3 scripts/check_shell_permissions.py --audit
          > .ci-evidence/shell-permissions.txt
      - name: Pure, unit, architecture, and CI helper budget
        run: >-
          uv run python scripts/run_test_budget.py
          --label pure-unit-architecture
          --budget-seconds 10
          --timeout-seconds 300
          --result .ci-evidence/pure.json
          --
          .venv/bin/python -m pytest -q
          tests/scaffold/test_application.py
          tests/scaffold/test_architecture.py tests/inventory tests/ci
          tests/unit
          --ignore=tests/unit/execution/test_run_adapters.py
      - name: Complete offline budget
        run: >-
          uv run python scripts/run_test_budget.py
          --label complete-offline
          --budget-seconds 60
          --timeout-seconds 300
          --include-result .ci-evidence/pure.json
          --result .ci-evidence/offline.json
          --
          .venv/bin/python -m pytest -q
          tests/adapters tests/contracts
          tests/scaffold/test_cli.py tests/scaffold/test_cli_planning.py
          tests/scaffold/test_cli_execution.py tests/integration
          tests/unit/execution/test_run_adapters.py
      - name: Build package
        run: uv build
      - name: Inspect and smoke-test wheel
        shell: bash
        run: |
          uv run python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              entry_point_paths = [
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              ]
              assert len(entry_point_paths) == 1, entry_point_paths
              entry_points = archive.read(entry_point_paths[0]).decode()
          assert all(
              name.startswith(("coreelec_reconciler/", "coreelec_reconciler-"))
              for name in names
          ), names
          required = {
              "coreelec_reconciler/bootstrap.py",
              "coreelec_reconciler/adapters/paramiko_session.py",
              "coreelec_reconciler/adapters/paramiko_managed_file.py",
              "coreelec_reconciler/cli/main.py",
              "coreelec_reconciler/execution/composition.py",
              "coreelec_reconciler/execution/engine.py",
              "coreelec_reconciler/execution/observation.py",
              "coreelec_reconciler/execution/plan_store.py",
              "coreelec_reconciler/execution/recovery_access.py",
              "coreelec_reconciler/execution/run_adapters.py",
              "coreelec_reconciler/execution/run_store.py",
              "coreelec_reconciler/execution/session_close.py",
              "coreelec_reconciler/execution/verification.py",
              "coreelec_reconciler/pilot_dry_run.py",
              "coreelec_reconciler/persistence/observation_documents.py",
              "coreelec_reconciler/transports/remote_ownership.py",
          }
          assert required <= set(names), required - set(names)
          assert not any(
              name.startswith(("tests/", "scripts/", ".github/")) for name in names
          )
          assert (
              "coreelec-reconciler = coreelec_reconciler.cli.main:main"
              in entry_points
          )
          evidence_directory = Path(".ci-evidence")
          evidence_directory.mkdir(exist_ok=True)
          (evidence_directory / "wheel-contents.txt").write_text(
              "\n".join(names) + "\n",
              encoding="utf-8",
          )
          digests = []
          artifacts = [
              *Path("dist").glob("*.whl"),
              *Path("dist").glob("*.tar.gz"),
          ]
          for artifact in sorted(artifacts):
              with artifact.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              digests.append(f"{digest}  {artifact}")
          (evidence_directory / "artifacts.sha256").write_text(
              "\n".join(digests) + "\n",
              encoding="utf-8",
          )
          print(f"wheel inspection passed: {wheels[0]} ({len(names)} files)")
          print("\n".join(digests))
          PY
          uv venv --python 3.14 --clear .wheel-venv
          uv pip install \
            --python .wheel-venv/bin/python --no-deps dist/*.whl
          mkdir -p .wheel-smoke
          DEPENDENCY_SITE_PACKAGES="$(
            .venv/bin/python -c 'import site; print(site.getsitepackages()[0])'
          )"
          (
            cd .wheel-smoke
            export PYTHONPATH="$DEPENDENCY_SITE_PACKAGES"
            export HOME="$PWD/home"
            ../.wheel-venv/bin/coreelec-reconciler --version
            ../.wheel-venv/bin/coreelec-reconciler --help >/dev/null
            ../.wheel-venv/bin/coreelec-reconciler \
              --repository-root .. validate >/dev/null
            set +e
            output="$(
              ../.wheel-venv/bin/coreelec-reconciler \
                --repository-root .. apply \
                019950f8-4c00-7000-8000-000000999999 2>&1
            )"
            status=$?
            set -e
            test "$status" -eq 3
            grep -q \
              "apply: capability_unavailable (production.saved-plan-rejected)" \
              <<<"$output"
            ../.wheel-venv/bin/python \
              ../scripts/run_m3_pilot_harness.py \
              --dry-run --output installed-wheel-pilot
            ../.wheel-venv/bin/python \
              ../scripts/verify_m3_evidence_bundle.py \
              installed-wheel-pilot
          )
      - name: Generate and verify deterministic pilot dry run
        shell: bash
        run: |
          uv run python scripts/run_m3_pilot_harness.py \
            --dry-run \
            --output .ci-evidence/m3-pilot-dry-run
          uv run python scripts/run_m3_pilot_harness.py \
            --dry-run \
            --output .ci-evidence/m3-pilot-dry-run-repeat
          diff -r \
            .ci-evidence/m3-pilot-dry-run \
            .ci-evidence/m3-pilot-dry-run-repeat
          uv run python scripts/verify_m3_evidence_bundle.py \
            .ci-evidence/m3-pilot-dry-run
          git rev-parse HEAD^{tree} > .ci-evidence/source-tree.txt
          shasum -a 256 uv.lock > .ci-evidence/lock.sha256
      - name: Upload source-bound CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-ci-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_SHA }}
          path: .ci-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
